<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>추억 저장소 · 노천극장 놀이터</title>
<meta name="description" content="노천극장 놀이터에서 함께 남긴 사진들을 이벤트별로 모았어요.">
<meta property="og:title" content="추억 저장소 · 노천극장 놀이터">
<meta property="og:image" content="assets/memories/1561093599637016637_0.webp">
<meta name="theme-color" content="#0b0c10">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0b0c10; --bg-2:#13151c; --line:rgba(255,255,255,.09); --text:#f2f3f5; --text-2:#a3a8b3; --text-3:#6f7480;
  --frog:#6DB552; --gold:#f2c14e;
  --font:"Pretendard Variable", Pretendard, "Lexend", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --latin:"Lexend", var(--font);
  --gut:clamp(16px, 4vw, 48px); --max:1240px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0; background:var(--bg); color:var(--text); font:400 16px/1.6 var(--font); -webkit-font-smoothing:antialiased; word-break:keep-all}
a{color:inherit}
img{display:block; max-width:100%}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--frog); outline-offset:3px}

/* 맨 위 막대 */
.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px var(--gut);
  background:rgba(11,12,16,.78); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; font:700 15px/1 var(--font)}
.brand i{font-style:normal; font-size:18px}
.home{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; text-decoration:none; font:600 14px/1 var(--font); color:var(--text-2); transition:color .2s, border-color .2s}
.home:hover{color:var(--text); border-color:rgba(255,255,255,.3)}

/* 표지 */
/* 10-22 주인님: 대표 사진은 잘리지 않게 원래 비율(와이드) 그대로, 글은 사진 아래 */
.cover{position:relative; overflow:hidden; isolation:isolate}
.cover::before{content:""; position:absolute; inset:-10%; z-index:-1; background:var(--cv) center/cover no-repeat; filter:blur(48px) saturate(1.2); opacity:.32}
.cover-pic{position:relative; display:block; margin:0}
.cover-pic img{display:block; width:100%; height:auto}
.cover-pic::after{content:""; position:absolute; left:0; right:0; bottom:0; height:12%; background:linear-gradient(180deg, transparent, var(--bg))}
.cover-txt{padding:clamp(18px, 3vw, 36px) var(--gut) clamp(32px, 5vw, 64px)}
.cover-in{position:relative; z-index:1; width:100%; max-width:var(--max); margin:0 auto}
.eyebrow{margin:0 0 14px; font:600 12px/1 var(--latin); letter-spacing:.28em; text-transform:uppercase; color:var(--text-2)}
.cover h1{margin:0; font:800 clamp(44px, 9vw, 112px)/.98 var(--font); letter-spacing:-.03em}
.cover p.lead{margin:20px 0 0; max-width:36ch; font:400 clamp(16px, 2vw, 20px)/1.6 var(--font); color:var(--text-2)}
.stats{display:flex; flex-wrap:wrap; gap:8px 28px; margin-top:28px; font:500 14px/1.4 var(--font); color:var(--text-2)}
.stats b{display:block; font:700 26px/1.1 var(--latin); color:var(--text)}

/* 앨범 목록 */
.wrap{max-width:var(--max); margin:0 auto; padding:0 var(--gut) 96px}
.sec-t{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:56px 0 20px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.sec-t h2{margin:0; font:700 22px/1.2 var(--font); letter-spacing:-.01em}
.sec-t span{font:500 14px/1 var(--font); color:var(--text-3)}
.albums{display:grid; grid-template-columns:repeat(12, 1fr); gap:clamp(12px, 1.6vw, 20px)}
.album{position:relative; grid-column:span 4; display:block; aspect-ratio:4/5; border-radius:18px; overflow:hidden; text-decoration:none; background:var(--bg-2); isolation:isolate}
.album.feature{grid-column:span 8; aspect-ratio:auto; min-height:100%}
.album img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.album::after{content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, transparent 40%, rgba(5,6,10,.86) 100%)}
.album:hover img,.album:focus-visible img{transform:scale(1.05)}
.album-in{position:absolute; left:0; right:0; bottom:0; z-index:2; padding:clamp(18px, 2.4vw, 28px)}
.album-k{margin:0 0 8px; font:600 12px/1 var(--latin); letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.72)}
.album h3{margin:0; font:700 clamp(22px, 2.6vw, 32px)/1.15 var(--font); letter-spacing:-.02em}
.album.feature h3{font-size:clamp(28px, 4vw, 48px)}
.album-m{margin:8px 0 0; font:500 14px/1.4 var(--font); color:rgba(255,255,255,.78)}
.badge{display:inline-block; margin-left:6px; padding:3px 8px; border-radius:999px; background:var(--gold); color:#2a1d00; font:700 11px/1.3 var(--font); vertical-align:3px}
@media (max-width:900px){.album{grid-column:span 6} .album.feature{grid-column:span 12; aspect-ratio:16/10}}
@media (max-width:560px){.album,.album.feature{grid-column:span 12; aspect-ratio:16/11}}

/* 앨범 안 */
.ahead{padding:clamp(36px, 6vw, 72px) 0 8px}
.back{display:inline-flex; align-items:center; gap:6px; margin-bottom:24px; padding:0; border:0; background:none; color:var(--text-2); font:600 14px/1 var(--font); cursor:pointer}
.back:hover{color:var(--text)}
.ahead h1{margin:0; font:800 clamp(36px, 6vw, 72px)/1.02 var(--font); letter-spacing:-.03em}
.ahead p{margin:14px 0 0; max-width:52ch; color:var(--text-2); font:400 17px/1.6 var(--font)}
.champ{display:flex; flex-wrap:wrap; align-items:center; gap:6px 20px; margin-top:22px; padding:16px 20px; border:1px solid rgba(242,193,78,.35); border-radius:14px;
  background:linear-gradient(90deg, rgba(242,193,78,.12), rgba(242,193,78,0)); font:500 15px/1.4 var(--font); color:var(--text-2)}
.champ b{color:var(--gold); font-weight:700}
.chap{display:flex; align-items:baseline; gap:10px; margin:48px 0 16px}
.chap h2{margin:0; font:700 20px/1.2 var(--font)}
.chap span{font:500 14px/1 var(--latin); color:var(--text-3)}
.grid{columns:4 260px; column-gap:12px}
.ph{break-inside:avoid; margin:0 0 12px; border-radius:12px; overflow:hidden; background:var(--bg-2); cursor:zoom-in; position:relative}
.ph img{width:100%; height:auto; transition:opacity .4s, transform .6s cubic-bezier(.2,.8,.2,1)}
.ph:hover img{transform:scale(1.02)}
.ph figcaption{position:absolute; left:0; right:0; bottom:0; padding:28px 12px 10px; font:500 13px/1.4 var(--font); color:#fff;
  background:linear-gradient(transparent, rgba(0,0,0,.7)); opacity:0; transition:opacity .25s}
.ph:hover figcaption,.ph:focus-visible figcaption{opacity:1}
@media (hover:none){.ph figcaption{opacity:1}}
@media (max-width:560px){.grid{columns:2; column-gap:8px} .ph{margin-bottom:8px; border-radius:8px}}

/* 크게 보기 */
.lb{position:fixed; inset:0; z-index:50; display:grid; grid-template-rows:1fr auto; background:rgba(5,6,10,.96)}
.lb[hidden]{display:none}
.lb-stage{display:grid; place-items:center; padding:56px clamp(8px, 7vw, 96px) 8px; min-height:0}
.lb-stage img{max-width:100%; max-height:calc(100vh - 150px); border-radius:6px}
.lb-cap{padding:12px 20px 22px; text-align:center; font:400 15px/1.5 var(--font); color:var(--text-2)}
.lb-cap b{color:var(--text); font-weight:600}
.lb-btn{position:absolute; display:grid; place-items:center; width:48px; height:48px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.06); cursor:pointer; font-size:20px; color:var(--text)}
.lb-btn:hover{background:rgba(255,255,255,.14)}
.lb-x{top:14px; right:14px} .lb-p{left:14px; top:50%; transform:translateY(-50%)} .lb-n{right:14px; top:50%; transform:translateY(-50%)}
.lb-i{position:absolute; top:26px; left:20px; font:500 13px/1 var(--latin); color:var(--text-3)}
@media (max-width:560px){.lb-p,.lb-n{top:auto; bottom:14px; transform:none}}

.foot{padding:40px var(--gut); text-align:center; color:var(--text-3); font:400 13px/1.6 var(--font); border-top:1px solid var(--line)}
.empty{padding:120px 0; text-align:center; color:var(--text-2)}

/* 앨범별 / 날짜별 */
.views{display:inline-flex; padding:4px; border:1px solid var(--line); border-radius:999px; background:var(--bg-2)}
.views a{padding:8px 16px; border-radius:999px; text-decoration:none; font:600 14px/1 var(--font); color:var(--text-2)}
.views a[aria-current="page"]{background:var(--text); color:var(--bg)}
.day{display:flex; align-items:baseline; gap:12px; margin:44px 0 14px; padding-top:18px; border-top:1px solid var(--line)}
.day h2{margin:0; font:700 22px/1.2 var(--font)}
.day span{font:500 14px/1 var(--font); color:var(--text-3)}
.tag{display:inline-block; margin-left:6px; padding:2px 7px; border-radius:999px; background:rgba(255,255,255,.14); font-size:11px}
/* 사진 정리 (관리자) */
.edit-btn{display:none; align-items:center; gap:6px; padding:8px 14px; border:1px solid rgba(242,193,78,.5); border-radius:999px; background:none; color:var(--gold); font:600 14px/1 var(--font); cursor:pointer}
.edit-btn.on{display:inline-flex}
.edit-btn[aria-pressed="true"]{background:var(--gold); color:#2a1d00}
.editing .ph{cursor:default}
.mv{display:none; position:absolute; top:8px; left:8px; right:8px; z-index:2; padding:7px 8px; border:0; border-radius:8px; background:rgba(11,12,16,.88); color:#fff; font:600 13px/1.2 var(--font)}
.editing .mv{display:block}
.editing .ph figcaption{opacity:1}
.toast{position:fixed; left:50%; bottom:24px; z-index:60; transform:translateX(-50%); padding:12px 18px; border-radius:999px; background:#fff; color:#0b0c10; font:600 14px/1 var(--font); box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.keybar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; max-width:var(--max); margin:16px auto 0; padding:12px var(--gut); color:var(--text-2); font:500 14px/1.4 var(--font)}
.keybar[hidden]{display:none}
.keybar input{flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg-2); color:var(--text); font:inherit}
.keybar button{padding:9px 14px; border:0; border-radius:10px; background:var(--gold); color:#2a1d00; font:700 14px/1 var(--font); cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><i aria-hidden="true">🐸</i>노천극장 놀이터</a>
  <span style="display:flex; gap:8px; align-items:center">
    <button class="edit-btn" id="editBtn" type="button" aria-pressed="false">✏️ 사진 정리</button>
    <a class="home" href="./">홈페이지로 <span aria-hidden="true">→</span></a>
  </span>
</header>
<div class="keybar" id="keyBar" hidden><span>관리자 키를 넣으면 사진을 다른 앨범으로 옮길 수 있어요.</span><input id="keyIn" type="password" autocomplete="off" placeholder="관리자 키"><button id="keyGo" type="button">확인</button></div>
<main id="app"><p class="empty">사진을 불러오는 중이에요…</p></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <span class="lb-i" id="lbI"></span>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <p class="lb-cap" id="lbCap"></p>
  <button class="lb-btn lb-x" type="button" data-lb="x" aria-label="닫기">✕</button>
  <button class="lb-btn lb-p" type="button" data-lb="p" aria-label="이전 사진">←</button>
  <button class="lb-btn lb-n" type="button" data-lb="n" aria-label="다음 사진">→</button>
</div>
<p class="toast" id="toast" hidden></p>
<footer class="foot">디스코드 #마크 채널에 올린 사진이 여기에 차곡차곡 쌓여요.</footer>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbwdpNGUS7CvDEm_zvMIFWFCI4etp1Ejxy0MhSPRAElFxsq--7mAVmBO-y0jNKgrW1uC/exec';
  var app = document.getElementById('app'), D = null, editing = false, key = '';
  var CH = ['우승 · 결과', '단체 사진', '무대 · 연출', '경기 장면', '준비 · 응원'];
  var EN = {battle:'Trainer Battle', town:'Village & Builds', poke:'Pokémon', adventure:'Adventure', daily:'Everyday', record:'Records'};
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function md(d){ var p = (d || '').split('-'); return p.length === 3 ? (+p[1]) + '월 ' + (+p[2]) + '일' : d; }
  function wd(d){ var t = new Date(d + 'T12:00:00'); return isNaN(t) ? '' : WD[t.getDay()] + '요일'; }
  function span(arr){ var a = arr[0].date, b = arr[arr.length - 1].date; return a === b ? md(a) : md(a) + ' – ' + md(b); }
  function byCat(id){ return D.items.filter(function(m){ return m.cat === id; }); }
  function coverOf(arr){ return arr.filter(function(m){ return m.acover; })[0] || arr.filter(function(m){ return m.hero; })[0] || arr[Math.floor(arr.length / 2)]; }
  function catName(id){ var c = D.cats.filter(function(x){ return x.id === id; })[0]; return c ? c.icon + ' ' + c.name : id; }
  function views(cur){ return '<nav class="views" aria-label="보기"><a href="#"' + (cur === 'album' ? ' aria-current="page"' : '') + '>앨범별</a><a href="#dates"' + (cur === 'dates' ? ' aria-current="page"' : '') + '>날짜별</a></nav>'; }

  function home(){
    var all = D.items, people = {}, days = {};
    all.forEach(function(m){ people[m.who] = 1; days[m.date] = 1; });
    var cats = D.cats.filter(function(c){ return byCat(c.id).length; });
    var cover = all.filter(function(m){ return m.cover; })[0] || coverOf(all);
    var h = '<section class="cover" style="--cv:url(assets/memories/' + esc(cover.thumb) + ')"><figure class="cover-pic"><img src="assets/memories/' + esc(cover.file) + '" alt="' + esc(cover.text || '대표 사진') + '"></figure>'
      + '<div class="cover-txt"><div class="cover-in"><p class="eyebrow">Nochen Memories</p><h1>추억 저장소</h1>'
      + '<p class="lead">트레이너 배틀부터 우리가 꾸민 마을까지. 노천극장에서 함께 남긴 순간들을 앨범으로 모았어요.</p>'
      + '<div class="stats"><span><b>' + all.length + '</b>장의 사진</span><span><b>' + cats.length + '</b>개의 앨범</span><span><b>' + Object.keys(people).length + '</b>명이 올렸어요</span><span><b>' + Object.keys(days).length + '</b>일의 기록</span></div></div></div></section>'
      + '<div class="wrap"><div class="sec-t"><h2>앨범</h2>' + views('album') + '</div><div class="albums">';
    cats.forEach(function(c, i){
      var arr = byCat(c.id), cv = coverOf(arr);
      h += '<a class="album' + (i === 0 ? ' feature' : '') + '" href="#' + c.id + '"><img loading="lazy" src="assets/memories/' + esc(i === 0 ? cv.file : cv.thumb) + '" alt="">'
        + '<div class="album-in"><p class="album-k">' + (EN[c.id] || '') + '</p><h3>' + esc(c.name) + (c.id === 'battle' ? '<span class="badge">EVENT</span>' : '') + '</h3>'
        + '<p class="album-m">' + span(arr) + ' · ' + arr.length + '장</p></div></a>';
    });
    app.innerHTML = h + '</div></div>';
    document.title = '추억 저장소 · 노천극장 놀이터';
  }

  var view = [];
  function moveSel(m){
    var opts = '';
    D.cats.forEach(function(c){
      if (c.id === 'battle') CH.forEach(function(sb){ var v = 'battle|' + sb, on = m.cat === 'battle' && (m.sub || '경기 장면') === sb; opts += '<option value="' + esc(v) + '"' + (on ? ' selected' : '') + '>🏆 배틀 · ' + esc(sb) + '</option>'; });
      else opts += '<option value="' + c.id + '"' + (m.cat === c.id ? ' selected' : '') + '>' + esc(c.icon + ' ' + c.name) + '</option>';
    });
    opts += '<option disabled>──────────</option><option value="@cover">' + (m.acover ? '⭐ 지금 이 앨범 대표 사진' : '⭐ 이 앨범 대표 사진으로') + '</option><option value="hide">🗑️ 이 사진 지우기</option>';
    return '<select class="mv" aria-label="이 사진 정리" data-f="' + esc(m.file) + '">' + opts + '</select>';
  }
  function tiles(arr, showCat){
    return '<div class="grid">' + arr.map(function(m){
      var i = view.push(m) - 1;
      return '<figure class="ph" tabindex="0" data-i="' + i + '">' + moveSel(m) + '<img loading="lazy" src="assets/memories/' + esc(m.thumb) + '" alt="' + esc(m.text || m.who + '님의 사진') + '">'
        + '<figcaption>' + esc(m.who) + ' · ' + md(m.date) + (showCat ? '<span class="tag">' + esc(catName(m.cat)) + '</span>' : '') + (m.text ? '<br>' + esc(m.text) : '') + '</figcaption></figure>';
    }).join('') + '</div>';
  }
  function album(id){
    var c = D.cats.filter(function(x){ return x.id === id; })[0], arr = byCat(id);
    if (!c) { home(); return; }
    view = [];
    var h = '<div class="wrap"><div class="ahead"><a class="back" href="#">← 모든 앨범</a>'
      + '<p class="eyebrow">' + (EN[id] || '') + (arr.length ? ' · ' + span(arr) + ' · ' + arr.length + '장' : '') + '</p><h1>' + esc(c.name) + '</h1><p>' + esc(c.desc) + '</p>';
    if (id === 'battle') h += '<div class="champ"><span>🏆 노천 트레이너 배틀 · 2026년 10월 17일</span><span>👑 우승 <b>이연규</b> · 결승 2 : 0</span></div>';
    h += '</div>';
    if (!arr.length) h += '<p class="empty">이 앨범은 비어 있어요.</p>';
    else if (id === 'battle') {
      CH.forEach(function(ch){
        var g = arr.filter(function(m){ return (m.sub || '경기 장면') === ch; }).sort(function(a, b){ return (b.hero ? 1 : 0) - (a.hero ? 1 : 0); });
        if (g.length) h += '<div class="chap"><h2>' + esc(ch) + '</h2><span>' + g.length + '</span></div>' + tiles(g);
      });
    } else h += '<div style="height:28px"></div>' + tiles(arr.slice().reverse());
    app.innerHTML = h + '</div>';
    document.title = c.name + ' · 추억 저장소';
  }
  function dates(){
    view = [];
    var g = {}, order = [];
    D.items.forEach(function(m){ if (!g[m.date]) { g[m.date] = []; order.push(m.date); } g[m.date].push(m); });
    order.sort().reverse();
    var h = '<div class="wrap"><div class="ahead"><a class="back" href="#">← 모든 앨범</a><p class="eyebrow">By Date · ' + order.length + '일 · ' + D.items.length + '장</p><h1>날짜별로 보기</h1><p>그날 무슨 일이 있었는지, 날짜 순서대로 넘겨 보세요.</p>'
      + '<div style="margin-top:22px">' + views('dates') + '</div></div>';
    order.forEach(function(d){ h += '<div class="day" id="d' + d + '"><h2>' + md(d) + ' <small style="font-weight:500; color:var(--text-2)">' + wd(d) + '</small></h2><span>' + g[d].length + '장</span></div>' + tiles(g[d], true); });
    app.innerHTML = h + '</div>';
    document.title = '날짜별 · 추억 저장소';
  }
  function route(){
    if (!D) return;
    var id = location.hash.slice(1);
    if (id === 'dates') dates(); else if (id) album(id); else home();
    app.classList.toggle('editing', editing);
  }
  addEventListener('hashchange', function(){ route(); scrollTo(0, 0); });
  app.addEventListener('click', function(e){
    if (e.target.closest('.mv')) return;
    var f = e.target.closest('.ph'); if (f && !editing) open(+f.dataset.i);
  });
  app.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !editing) { var f = e.target.closest('.ph'); if (f) open(+f.dataset.i); } });

  // ---- 사진 옮기기 (관리자 키: 대진표와 같은 키) ----
  var toastT = 0;
  function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ el.hidden = true; }, 2600); }
  function applyMoves(mv){
    if (!mv) return;
    D.items = D.items.filter(function(m){ return mv[m.file] !== 'hide'; });
    D.items.forEach(function(m){ var v = mv[m.file]; if (!v) return; var p = String(v).split('|'); m.cat = p[0]; m.sub = p[1] || null; });
    Object.keys(mv).forEach(function(k){
      if (k.indexOf('@cover:') !== 0) return;
      var cat = k.slice(7); D.items.forEach(function(m){ if (m.cat === cat) m.acover = (m.file === mv[k]); });
    });
  }
  var queue = {}, saving = false;
  function flush(){
    if (saving || !Object.keys(queue).length) return;
    saving = true; var batch = queue; queue = {};
    fetch(API + '?bracket=1&_=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
      var data = (d && d.data) || {};
      data.mem = Object.assign({}, data.mem || {}, batch);
      return fetch(API, {method:'POST', body:JSON.stringify({action:'bracket', key:key, data:data})}).then(function(r){ return r.json(); });
    }).then(function(r){
      if (r && r.ok) toast('✅ 저장했어요 · 모두에게 보여요');
      else { toast(r && r.error === 'key' ? '관리자 키가 달라요' : '저장이 안 됐어요'); Object.assign(queue, batch); }
    }).catch(function(){ toast('저장이 안 됐어요. 다시 해 볼게요'); Object.assign(queue, batch); }).then(function(){ saving = false; if (Object.keys(queue).length) setTimeout(flush, 1500); });
  }
  app.addEventListener('change', function(e){
    var sel = e.target.closest('.mv'); if (!sel) return;
    var f = sel.dataset.f, v = sel.value, m = D.items.filter(function(x){ return x.file === f; })[0];
    if (v === '@cover') {
      D.items.forEach(function(x){ if (x.cat === m.cat) x.acover = (x === m); });
      queue['@cover:' + m.cat] = f; toast('⭐ ' + catName(m.cat) + ' 대표 사진으로 정했어요 (저장 중…)');
    } else if (v === 'hide') {
      if (!confirm('이 사진을 추억 저장소에서 지울까요?')) { var y0 = scrollY; route(); scrollTo(0, y0); return; }
      D.items = D.items.filter(function(x){ return x !== m; });
      queue[f] = 'hide'; toast('🗑️ 지웠어요 (저장 중…)');
    } else {
      var p = v.split('|'); m.cat = p[0]; m.sub = p[1] || null;
      queue[f] = v; toast('옮겼어요 → ' + catName(p[0]) + (p[1] ? ' · ' + p[1] : '') + ' (저장 중…)');
    }
    var y = scrollY; route(); scrollTo(0, y); flush();
  });
  var btn = document.getElementById('editBtn'), bar = document.getElementById('keyBar');
  try { key = localStorage.getItem('deck-admin-key') || ''; } catch (x) {}
  if (key) btn.classList.add('on');
  if (!key && /[?&]edit\b/.test(location.search)) bar.hidden = false;
  document.getElementById('keyGo').addEventListener('click', function(){
    var v = document.getElementById('keyIn').value.trim(); if (!v) return;
    key = v; try { localStorage.setItem('deck-admin-key', v); } catch (x) {}
    bar.hidden = true; btn.classList.add('on'); editing = true; btn.setAttribute('aria-pressed', 'true'); route();
  });
  btn.addEventListener('click', function(){
    editing = !editing; btn.setAttribute('aria-pressed', editing ? 'true' : 'false');
    btn.textContent = editing ? '✅ 정리 끝내기' : '✏️ 사진 정리';
    if (editing) toast('사진 위 칸에서 옮길 앨범을 고르세요');
    var y = scrollY; route(); scrollTo(0, y);
  });

  // ---- 크게 보기 ----
  var lb = document.getElementById('lb'), cur = 0, sx = 0;
  function show(i){
    cur = (i + view.length) % view.length; var m = view[cur];
    document.getElementById('lbImg').src = 'assets/memories/' + m.file;
    document.getElementById('lbCap').innerHTML = (m.text ? esc(m.text) + '<br>' : '') + '<b>' + esc(m.who) + '</b> · ' + md(m.date);
    document.getElementById('lbI').textContent = (cur + 1) + ' / ' + view.length;
  }
  function open(i){ lb.hidden = false; document.body.style.overflow = 'hidden'; show(i); }
  function close(){ lb.hidden = true; document.body.style.overflow = ''; }
  lb.addEventListener('click', function(e){
    var b = e.target.closest('[data-lb]');
    if (b) { if (b.dataset.lb === 'x') close(); else show(cur + (b.dataset.lb === 'n' ? 1 : -1)); }
    else if (!e.target.closest('img')) close();
  });
  lb.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', function(e){ var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); });
  addEventListener('keydown', function(e){
    if (lb.hidden) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1);
  });

  fetch('assets/memories/memories.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    D = d; D.items = D.items || []; D.cats = D.cats || [];
    if (!D.items.length) { app.innerHTML = '<p class="empty">아직 사진을 모으는 중이에요.</p>'; return; }
    route();
    // 사이트에 아직 안 굳은 '옮긴 기록'을 덧입힌다 (느려도 괜찮게 나중에)
    fetch(API + '?bracket=1&_=' + Date.now()).then(function(r){ return r.json(); }).then(function(b){
      if (b && b.data && b.data.mem) { applyMoves(b.data.mem); var y = scrollY; route(); scrollTo(0, y); }
    }).catch(function(){});
  }).catch(function(){ app.innerHTML = '<p class="empty">사진을 못 불러왔어요. 잠시 뒤에 다시 와 주세요.</p>'; });
})();
</script>
</body>
</html>
